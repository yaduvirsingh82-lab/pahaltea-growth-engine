<!doctype html>
<html><head><meta charset="utf-8"><style>
  @page { margin: 0 }
  * { margin:0; padding:0; box-sizing:border-box }
  html,body { width:1080px; height:1080px; overflow:hidden; }
  body {
    background:#F3EADB;
    font-family:"Bitstream Charter","Charter",serif;
    color:#2B1A10;
    -webkit-font-smoothing:antialiased;
  }
  .card {
    position:relative; width:1080px; height:1080px;
    padding:74px 92px 66px;
    display:flex; flex-direction:column;
    background:
      radial-gradient(120% 90% at 50% 8%, rgba(255,252,246,.85) 0%, rgba(243,234,219,0) 62%),
      radial-gradient(100% 80% at 50% 108%, rgba(150,96,45,.16) 0%, rgba(243,234,219,0) 60%),
      #F3EADB;
  }
  .frame {
    position:absolute; inset:44px; border:1px solid rgba(120,74,38,.28);
  }
  .frame::before, .frame::after {
    content:""; position:absolute; width:14px; height:14px; border:1px solid rgba(120,74,38,.45);
  }
  .frame::before { top:-7px; left:-7px; border-right:0; border-bottom:0 }
  .frame::after  { bottom:-7px; right:-7px; border-left:0; border-top:0 }

  header { text-align:center; position:relative; z-index:2 }
  .leaf { margin:0 auto 22px; display:block }
  .brand {
    font-family:"Liberation Sans",sans-serif; font-weight:700;
    font-size:25px; letter-spacing:.44em; text-indent:.44em;
    color:#7A4A26; text-transform:uppercase;
  }
  .brand-rule {
    width:96px; height:1px; margin:22px auto 0;
    background:linear-gradient(90deg,transparent,rgba(122,74,38,.75),transparent);
  }

  main { flex:1; display:flex; flex-direction:column; justify-content:center; position:relative; z-index:2 }
  .line { font-size:76px; line-height:1.19; letter-spacing:-.012em; text-align:center }
  .line + .line { margin-top:4px }
  .accent { color:#9A4E1E; font-style:italic }

  .sub {
    margin-top:46px; text-align:center;
    font-size:27px; line-height:1.6; color:#5A4231;
    max-width:700px; margin-left:auto; margin-right:auto;
  }

  footer { position:relative; z-index:2 }
  .facts {
    display:flex; align-items:center; justify-content:center; gap:22px;
    font-family:"Liberation Sans",sans-serif; font-weight:600;
    font-size:20px; letter-spacing:.2em; text-transform:uppercase; color:#6B4A2E;
    padding-top:30px; border-top:1px solid rgba(120,74,38,.26);
  }
  .dot { width:5px; height:5px; border-radius:50%; background:#B5793F; flex:none }
  .packet {
    margin-top:22px; text-align:center;
    font-family:"Liberation Sans",sans-serif; font-size:18px;
    letter-spacing:.16em; text-transform:uppercase; color:#94765C;
  }
</style></head>
<body>
  <div class="card">
    <div class="frame"></div>

    <header>
      <svg class="leaf" width="46" height="52" viewBox="0 0 46 52" fill="none">
        <path d="M23 3C11 12 5 22 5 31a18 18 0 1 0 36 0c0-9-6-19-18-28Z"
              stroke="#8A5527" stroke-width="1.7" fill="rgba(181,121,63,.10)"/>
        <path d="M23 8v39" stroke="#8A5527" stroke-width="1.5"/>
        <path d="M23 22 13 16M23 22l10-6M23 33 12 26M23 33l11-7" stroke="#8A5527" stroke-width="1.3"/>
      </svg>
      <div class="brand">Pahal Tea</div>
      <div class="brand-rule"></div>
    </header>

    <main>
      <div class="line">Assam in the pot.</div>
      <div class="line">Spices in the pour.</div>
      <div class="line accent">Nothing else in the pack.</div>
      <p class="sub">Masala Tea, packed garden fresh &mdash; directly from<br>where the tea is grown.</p>
    </main>

    <footer>
      <div class="facts">
        <span>Assam</span><span class="dot"></span>
        <span>Amchong</span><span class="dot"></span>
        <span>Tea &amp; Spices</span><span class="dot"></span>
        <span>200g</span>
      </div>
      <div class="packet">No added flavours, colours, preservatives or additives</div>
    </footer>
  </div>
</body></html>
