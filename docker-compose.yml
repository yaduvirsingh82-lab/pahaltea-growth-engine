# Local development database only. These credentials are intentionally
# non-secret and must never be reused for staging or production.
services:
  postgres:
    image: postgres:16-alpine
    container_name: pahaltea-postgres
    environment:
      POSTGRES_USER: pahaltea
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: pahaltea_growth_engine
    ports:
      # Defaults to 5433: 5432 is commonly already taken by another local stack.
      - "${PAHALTEA_DB_PORT:-5433}:5432"
    volumes:
      - pahaltea-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pahaltea -d pahaltea_growth_engine"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Optional local, open-source model runtime. Not started by default:
  #   docker compose --profile ollama up -d ollama
  #   docker compose --profile ollama exec ollama ollama pull qwen2.5:3b-instruct
  ollama:
    image: ollama/ollama:latest
    container_name: pahaltea-ollama
    profiles: ["ollama"]
    ports:
      - "${PAHALTEA_OLLAMA_PORT:-11434}:11434"
    volumes:
      - pahaltea-ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  pahaltea-postgres-data:
  pahaltea-ollama-models:
